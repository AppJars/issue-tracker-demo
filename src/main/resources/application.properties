# ============================================================
# Server
# ============================================================

# Port the demo listens on. PORT wins when the environment defines it.
server.port=${PORT:8080}

# ============================================================
# Database
# ============================================================
# The schema is created by the Redmine container in docker-compose-redmine-postgres.yml, so those
# containers have to be up before the application starts. See the README.

spring.datasource.url=jdbc:postgresql://localhost:5440/redmine
spring.datasource.username=redmine
spring.datasource.password=secret
spring.datasource.driverClassName=org.postgresql.Driver

# Let Hibernate create its schema objects before data.sql runs
spring.jpa.defer-datasource-initialization=true
# The demo seeds its data from Java (DataInitializer, DemoDataSeeder), not from Spring's SQL init
spring.sql.init.mode=never
# Keep the session open while a view renders, so lazily loaded associations resolve in the UI
spring.jpa.open-in-view=true

# ============================================================
# Mail
# ============================================================
# Notification emails go to Mailpit, which captures them instead of sending them.
# Read them at http://localhost:8025. Without the container the application still starts; sending
# a notification just fails and is logged.

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.protocol=smtp
spring.mail.username=username
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# Uploads
# ============================================================

spring.servlet.multipart.max-file-size=1230MB
spring.servlet.multipart.max-request-size=1230MB

# ============================================================
# Vaadin
# ============================================================

# Open the default browser when the application starts in development mode
vaadin.launch-browser=true
# Packages Vaadin scans for routes and components
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,com.flowingcode

logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false

# ============================================================
# Issue Tracker AppJar
# ============================================================
# Every property below is listed with the value the AppJar itself defaults to. They are all given
# an explicit value on purpose: leaving one blank does not fall back to the default, it overrides
# it with an empty string.

# Whether the AppJar owns user authentication: passwords, the login form and user creation.
# Set to false when the host application manages credentials externally.
appjars.issuetracker.auth.enabled=true

# Directory attachments are written to, relative to the working directory. The demo shares it with
# the Redmine container, which mounts ./files.
appjars.issuetracker.attachment.file-path=files/

# Where a user is sent when they are authenticated but have no Issue Tracker account.
appjars.issuetracker.authuser.error.fallback-route=/

# Absolute base URL used to build the links inside notification emails. Set this to the address the
# application is actually reachable at, otherwise the links in the mails point at localhost.
appjars.issuetracker.url.base=http://localhost:8080/

# Routes the notification emails link to, appended to url.base. ":id" is replaced with the id of
# the issue or user the mail is about.
appjars.issuetracker.url.views.issue=it/issues/:id
appjars.issuetracker.url.views.users-profile=it/users/:id
appjars.issuetracker.url.views.settings=it/settings
