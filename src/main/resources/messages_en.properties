# ---------------------------------------------------------------- guided tours
# Every tour is read-only and stays on one view: the text explains what is already on screen
# rather than asking the visitor to do anything.
appjars.issuetracker.demo.tour.btn.back=Back
appjars.issuetracker.demo.tour.btn.next=Next
appjars.issuetracker.demo.tour.btn.done=Done

appjars.issuetracker.demo.tour.nav.intro.title=Finding your way around
appjars.issuetracker.demo.tour.nav.intro.desc=The drawer on the left is the whole application. Let''s go through what each section is for.
appjars.issuetracker.demo.tour.nav.mypage.title=My page
appjars.issuetracker.demo.tour.nav.mypage.desc=Your personal dashboard: issues assigned to you, issues you reported, the ones you watch and the time you logged. The blocks it shows are configurable.
appjars.issuetracker.demo.tour.nav.projects.title=Projects
appjars.issuetracker.demo.tour.nav.projects.desc=Every project you can see, as a tree. Each project has its own members, versions, categories and settings, and can contain subprojects.
appjars.issuetracker.demo.tour.nav.issues.title=Issues
appjars.issuetracker.demo.tour.nav.issues.desc=Issues across all projects at once, with the same filtering, grouping and saved queries you get inside a project.
appjars.issuetracker.demo.tour.nav.gantt.title=Gantt
appjars.issuetracker.demo.tour.nav.gantt.desc=Everything that has dates, on a timeline, with the dependencies between issues drawn as arrows.
appjars.issuetracker.demo.tour.nav.spenttime.title=Spent time
appjars.issuetracker.demo.tour.nav.spenttime.desc=Logged time, both as a list of individual entries and as a report you can aggregate any way you like.
appjars.issuetracker.demo.tour.nav.admin.title=Administration
appjars.issuetracker.demo.tour.nav.admin.desc=Only administrators see this section. It is where trackers, issue statuses, the workflow, custom fields, roles and users are configured.
appjars.issuetracker.demo.tour.nav.finish.title=That''s the map
appjars.issuetracker.demo.tour.nav.finish.desc=Pick another tour from the landing page whenever you want to go deeper into one of these, or just start clicking around — the demo data is yours to play with.

appjars.issuetracker.demo.tour.projects.grid.title=The project list
appjars.issuetracker.demo.tour.projects.grid.desc=Three projects ship with this demo. Apollo Platform is the one carrying the full dataset — issues, logged time, a roadmap and a custom workflow.
appjars.issuetracker.demo.tour.projects.tree.title=Subprojects
appjars.issuetracker.demo.tour.projects.tree.desc=Expand Apollo Platform and you''ll find Apollo Mobile underneath it. Subprojects have their own members and settings, and searches can be scoped to include them.
appjars.issuetracker.demo.tour.projects.status.title=Project status
appjars.issuetracker.demo.tour.projects.status.desc=Legacy Portal is closed: it stays readable for reference but takes no new work. Projects can also be archived to hide them entirely.
appjars.issuetracker.demo.tour.projects.new.title=Creating a project
appjars.issuetracker.demo.tour.projects.new.desc=New projects are created here. The form lets you pick which modules the project uses, so a project that does not track time simply never shows those screens.
appjars.issuetracker.demo.tour.projects.finish.title=Open a project
appjars.issuetracker.demo.tour.projects.finish.desc=Click through to Apollo Platform to see its overview, roadmap and settings tabs.

appjars.issuetracker.demo.tour.issues.grid.title=The issue list
appjars.issuetracker.demo.tour.issues.grid.desc=Every issue you have access to. Columns, sorting and grouping are all configurable, and the list is paginated on the server so it stays fast with a real backlog behind it.
appjars.issuetracker.demo.tour.issues.filters.title=Filters
appjars.issuetracker.demo.tour.issues.filters.desc=Filters combine on any attribute — status, tracker, assignee, version, dates, even custom fields. Note the default: only open issues. This demo deliberately keeps almost everything closed, so that default would show you very little.
appjars.issuetracker.demo.tour.issues.queries.title=Saved queries
appjars.issuetracker.demo.tour.issues.queries.desc=A filter combination can be saved and shared with the project, and a project can nominate one as its default — which is why this list opened on the whole backlog instead of the three open issues.
appjars.issuetracker.demo.tour.issues.groupby.title=Grouping
appjars.issuetracker.demo.tour.issues.groupby.desc=Group by any attribute to get subtotals per group. Try grouping by tracker or by assignee to see how the backlog is distributed.
appjars.issuetracker.demo.tour.issues.columns.title=Columns and export
appjars.issuetracker.demo.tour.issues.columns.desc=The column menu on the right of the header lets you choose what to show, and whatever you are looking at can be exported to CSV or Excel.
appjars.issuetracker.demo.tour.issues.detail.title=Opening an issue
appjars.issuetracker.demo.tour.issues.detail.desc=Click any subject to open it. Inside you''ll find its custom fields, its watchers, and a history where every change is attributed to whoever made it.
appjars.issuetracker.demo.tour.issues.new.title=Creating an issue
appjars.issuetracker.demo.tour.issues.new.desc=New issues start here. Which fields the form offers depends on the tracker you pick — a support request has no scheduling fields, a bug has severity instead of story points.
appjars.issuetracker.demo.tour.issues.finish.title=Have a look around
appjars.issuetracker.demo.tour.issues.finish.desc=Open an issue, change a filter, group the list — nothing here is fragile, and restarting the demo brings the original data back.

appjars.issuetracker.demo.tour.roadmap.intro.title=The roadmap
appjars.issuetracker.demo.tour.roadmap.intro.desc=Versions group work into milestones, and the roadmap shows how each one is progressing.
appjars.issuetracker.demo.tour.roadmap.versions.title=Versions
appjars.issuetracker.demo.tour.roadmap.versions.desc=Apollo Platform has three: 1.0 Foundation is released, 1.1 Reporting is what the team is on now, and 2.0 Self-service is still being planned. Each shows the issues assigned to it and how far along they are.
appjars.issuetracker.demo.tour.roadmap.finish.title=Versions are more than labels
appjars.issuetracker.demo.tour.roadmap.finish.desc=They drive the roadmap, the progress figures and the Gantt, and closing one can be blocked while it still has open issues.

appjars.issuetracker.demo.tour.gantt.chart.title=The Gantt chart
appjars.issuetracker.demo.tour.gantt.chart.desc=Every issue with a start and a due date, on a timeline. Like the issue list, the chart opens on open issues only \u2014 clear the status filter above to see the whole plan, epics included as summary bars spanning the work grouped under them.
appjars.issuetracker.demo.tour.gantt.dependencies.title=Dependencies
appjars.issuetracker.demo.tour.gantt.dependencies.desc=The arrows are real relations between issues. "Precedes" means the second cannot start until the first is done — and rescheduling the first will offer to move the rest along with it.
appjars.issuetracker.demo.tour.gantt.window.title=The time window
appjars.issuetracker.demo.tour.gantt.window.desc=Pick where the chart starts and how many months it spans, then zoom in or out to go from a day-by-day view to a whole year at a glance.
appjars.issuetracker.demo.tour.gantt.readonly.title=Editing on the chart
appjars.issuetracker.demo.tour.gantt.readonly.desc=Turn this off and the chart becomes editable: drag a bar to reschedule an issue, or drag between two bars to create a dependency.
appjars.issuetracker.demo.tour.gantt.finish.title=Try dragging something
appjars.issuetracker.demo.tour.gantt.finish.desc=Switch editing on and move a bar around — the changes go straight to the issues, and show up in their history.

appjars.issuetracker.demo.tour.time.grid.title=Time entries
appjars.issuetracker.demo.tour.time.grid.desc=Every hour logged against an issue, by whom, on what day and under which activity. This demo ships with about three months of them.
appjars.issuetracker.demo.tour.time.filters.title=Filters
appjars.issuetracker.demo.tour.time.filters.desc=Narrow the list by user, activity, project, issue or date range — including relative ranges like "this month" or "less than 30 days ago".
appjars.issuetracker.demo.tour.time.groupby.title=Grouping
appjars.issuetracker.demo.tour.time.groupby.desc=Group the entries and you get hours subtotalled per group, which is often all you need before reaching for the report.
appjars.issuetracker.demo.tour.time.report.title=The report
appjars.issuetracker.demo.tour.time.report.desc=This tab switches to the aggregated view, where hours are summed across a period and broken down by whichever criteria you choose.
appjars.issuetracker.demo.tour.time.finish.title=Logging time
appjars.issuetracker.demo.tour.time.finish.desc=Time can be logged from here or straight from an issue, and roles control who may log time for other people.

appjars.issuetracker.demo.tour.report.grid.title=The spent time report
appjars.issuetracker.demo.tour.report.grid.desc=Hours aggregated into a tree you can drill into. Every row totals the ones underneath it.
appjars.issuetracker.demo.tour.report.period.title=The period
appjars.issuetracker.demo.tour.report.period.desc=Choose how time is bucketed along the columns — by day, week, month or year.
appjars.issuetracker.demo.tour.report.groupby.title=The breakdown
appjars.issuetracker.demo.tour.report.groupby.desc=Choose what the rows are broken down by — project, user, activity, tracker, status or issue. Pick several and they nest, so you can go from a project total down to one person''s hours on one activity.
appjars.issuetracker.demo.tour.report.finish.title=One report, many questions
appjars.issuetracker.demo.tour.report.finish.desc=Combining the period and the breakdown answers most of what a team asks of a timesheet, without leaving the page.

appjars.issuetracker.demo.tour.workflow.intro.title=The workflow
appjars.issuetracker.demo.tour.workflow.intro.desc=A workflow decides which status changes are allowed — and, crucially, who is allowed to make them.
appjars.issuetracker.demo.tour.workflow.scope.title=Role and tracker
appjars.issuetracker.demo.tour.workflow.scope.desc=Transitions are defined per role and per tracker, so a developer and a QA engineer can have genuinely different powers over the same bug. This demo ships with exactly that.
appjars.issuetracker.demo.tour.workflow.edit.title=The transition matrix
appjars.issuetracker.demo.tour.workflow.edit.desc=Pick a role and a tracker, then press Edit: a grid appears with the current statuses down the side and the reachable ones across the top. The same screen also controls which fields each role may edit in each status.
appjars.issuetracker.demo.tour.workflow.finish.title=Try it with two roles
appjars.issuetracker.demo.tour.workflow.finish.desc=Compare Developer against QA Engineer on the Bug tracker to see the difference, then sign in as dsantos or pnovak and watch which statuses each of them is actually offered.

