# Home (landing page)
appjars.issuetracker.demo.home.title=Issue Tracker Demo
appjars.issuetracker.demo.home.hero.logoAlt=AppJars
appjars.issuetracker.demo.home.hero.title=Issue Tracker
appjars.issuetracker.demo.home.hero.tagline=A Redmine-style project and issue tracker for Vaadin: projects, trackers, workflows, Gantt charts and time tracking, ready to drop into your Spring Boot app.
appjars.issuetracker.demo.home.features.title=What''s inside
appjars.issuetracker.demo.home.features.projects.title=Projects & subprojects
appjars.issuetracker.demo.home.features.projects.desc=Organize work into projects and subprojects, each with its own members and settings. Add versioning to group issues into milestones and build a roadmap for the projects.
appjars.issuetracker.demo.home.features.issues.title=Issues & Gantt chart
appjars.issuetracker.demo.home.features.issues.desc=Create and manage issues with custom trackers, statuses and priorities; Visualize and edit them on a Gantt chart to plan and track your work on a timeline.
appjars.issuetracker.demo.home.features.customfields.title=Custom fields
appjars.issuetracker.demo.home.features.customfields.desc=Extend projects, and issues and time logs with custom fields — text, numbers, dates and selectors — with their own validation and visibility rules, no code required.
appjars.issuetracker.demo.home.features.history.title=History & watchers
appjars.issuetracker.demo.home.features.history.desc=Every change is recorded in the issue journals. Watch issues to get notified, add private notes visible only to the right roles.
appjars.issuetracker.demo.home.features.time.title=Time tracking
appjars.issuetracker.demo.home.features.time.desc=Log and report time spent on different activities. Keep tabs on the efforts spent by your team on projects and tasks.
appjars.issuetracker.demo.home.features.workflow.title=Configurable workflow
appjars.issuetracker.demo.home.features.workflow.desc=Define status transitions and field permissions per role and tracker.
appjars.issuetracker.demo.home.tryit.title=Try it now
appjars.issuetracker.demo.home.tryit.intro=Sign in with any of the accounts below \u2014 they have genuinely different permissions, so the application offers each of them different things. The guided tours ask you to sign in first, except the one about finding your way around.
appjars.issuetracker.demo.home.tryit.admin=Administrator \u2014 full access, including the administration screens
appjars.issuetracker.demo.home.tour.button=Guided tour
appjars.issuetracker.demo.home.tour.drawer=Quick guide
appjars.issuetracker.demo.home.tour.mypage=My page
