appjars.issuetracker.demo.home.tour.setup=Set up from scratch
appjars.issuetracker.demo.home.license.title=Free vs. full license
appjars.issuetracker.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 5 users, 5 open issues and 10 time entries per day. A full license removes these limits — nothing else changes.
