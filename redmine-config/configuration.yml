# = Redmine configuration file
#
# Each environment has its own configuration options.  If you are only
# running in production, only the production block needs to be configured.
# Environment specific configuration options override the default ones.
#
# Note that this file needs to be a valid YAML file.
# DO NOT USE TABS! Use 2 spaces instead of tabs for indentation.

# default configuration options for all environments
default:
  # Outgoing emails are handed to the Mailpit container defined in
  # docker-compose-redmine-postgres.yml, which captures them instead of delivering them. The
  # address below is that container's service name, so nothing leaves the Docker network.
  email_delivery:
    delivery_method: :smtp
    smtp_settings:
      address: "mailpit"
      port: 1025
      domain: "example.net"
      authentication: :none
